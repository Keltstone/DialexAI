name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Leave empty to use gradle.properties.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      is_draft: ${{ steps.meta.outputs.is_draft }}
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Metadata
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER=$(grep -E "^app.version=" gradle.properties | cut -d'=' -f2 || echo "1.0.0")
          fi
          
          VER="${RAW_VER#v}"
          TAG="v${VER}"
          
          IS_PRE="${{ github.event.inputs.prerelease || 'false' }}"
          IS_DRAFT="${{ github.event.inputs.draft || 'false' }}"
          
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRE}" >> $GITHUB_OUTPUT
          echo "is_draft=${IS_DRAFT}" >> $GITHUB_OUTPUT
          
          echo "📦 Target Release: ${TAG} (Version: ${VER})"

  build-macos:
    name: Build macOS Desktop (.dmg)
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/Kolt
          path: KoltLibs
          token: ${{ secrets.KOLTLIBS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Bundled Socratix Engine for macOS
        working-directory: DialexAI
        run: |
          mkdir -p engine-res/engine
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ needs.prepare-release.outputs.version }}" \
            -o engine-res/engine/socratix ./socratix-engine/cmd/socratix
          chmod +x engine-res/engine/socratix

      - name: Package Desktop Apps (Without Engine & With Engine)
        working-directory: DialexAI
        run: |
          mkdir -p staging-macos
          VER="${{ needs.prepare-release.outputs.version }}"
          ENGINE_RES="$(pwd)/engine-res"

          # 1. Dialex AI
          echo "Building Dialex AI (without-engine)..."
          (cd dialex-ai && ./gradlew :desktopApp:packageDmg "-Papp.version=${VER}" --no-daemon)
          find dialex-ai/desktopApp/build/compose/binaries/main/dmg -name "*.dmg" -exec cp {} staging-macos/DialexAI-${VER}-without-engine.dmg \;

          echo "Building Dialex AI (with-engine)..."
          (cd dialex-ai && ./gradlew :desktopApp:packageDmg "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon)
          find dialex-ai/desktopApp/build/compose/binaries/main/dmg -name "*.dmg" -exec cp {} staging-macos/DialexAI-${VER}-with-engine.dmg \;

          # 2. Artix AI
          echo "Building Artix AI (without-engine)..."
          (cd artix-ai && ./gradlew :app:packageDmg "-Papp.version=${VER}" --no-daemon)
          find artix-ai/app/build/compose/binaries/main/dmg -name "*.dmg" -exec cp {} staging-macos/ArtixAI-${VER}-without-engine.dmg \;

          echo "Building Artix AI (with-engine)..."
          (cd artix-ai && ./gradlew :app:packageDmg "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon)
          find artix-ai/app/build/compose/binaries/main/dmg -name "*.dmg" -exec cp {} staging-macos/ArtixAI-${VER}-with-engine.dmg \;

          # 3. Kritix AI
          echo "Building Kritix AI (without-engine)..."
          (cd kritix-ai && ./gradlew :app:packageDmg "-Papp.version=${VER}" --no-daemon)
          find kritix-ai/app/build/compose/binaries/main/dmg -name "*.dmg" -exec cp {} staging-macos/KritixAI-${VER}-without-engine.dmg \;

          echo "Building Kritix AI (with-engine)..."
          (cd kritix-ai && ./gradlew :app:packageDmg "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon)
          find kritix-ai/app/build/compose/binaries/main/dmg -name "*.dmg" -exec cp {} staging-macos/KritixAI-${VER}-with-engine.dmg \;

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suite-macos
          path: DialexAI/staging-macos/*

  build-windows:
    name: Build Windows Desktop (.msi & .exe)
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Configure Git Line Endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/Kolt
          path: KoltLibs
          token: ${{ secrets.KOLTLIBS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Verify and Add WiX Toolset to PATH
        shell: bash
        run: |
          for p in "C:/Program Files (x86)/WiX Toolset v3.11/bin" "C:/Program Files (x86)/WiX Toolset v3.14/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> $GITHUB_PATH
              echo "WiX found at $p"
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Bundled Socratix Engine for Windows
        working-directory: DialexAI
        shell: bash
        run: |
          mkdir -p engine-res/engine
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ needs.prepare-release.outputs.version }}" \
            -o engine-res/engine/socratix.exe ./socratix-engine/cmd/socratix

      - name: Package Windows Installers (MSI & EXE)
        working-directory: DialexAI
        shell: bash
        run: |
          mkdir -p staging-windows
          VER="${{ needs.prepare-release.outputs.version }}"
          ENGINE_RES="$(pwd)/engine-res"

          # 1. Dialex AI
          (cd dialex-ai && ./gradlew :desktopApp:packageMsi :desktopApp:packageExe "-Papp.version=${VER}" --no-daemon) || true
          find dialex-ai/desktopApp/build/compose/binaries/main -name "*.msi" -exec cp {} staging-windows/DialexAI-${VER}-without-engine.msi \; || true
          find dialex-ai/desktopApp/build/compose/binaries/main -name "*.exe" -exec cp {} staging-windows/DialexAI-${VER}-without-engine.exe \; || true

          (cd dialex-ai && ./gradlew :desktopApp:packageMsi :desktopApp:packageExe "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon) || true
          find dialex-ai/desktopApp/build/compose/binaries/main -name "*.msi" -exec cp {} staging-windows/DialexAI-${VER}-with-engine.msi \; || true
          find dialex-ai/desktopApp/build/compose/binaries/main -name "*.exe" -exec cp {} staging-windows/DialexAI-${VER}-with-engine.exe \; || true

          # 2. Artix AI
          (cd artix-ai && ./gradlew :app:packageMsi :app:packageExe "-Papp.version=${VER}" --no-daemon) || true
          find artix-ai/app/build/compose/binaries/main -name "*.msi" -exec cp {} staging-windows/ArtixAI-${VER}-without-engine.msi \; || true
          find artix-ai/app/build/compose/binaries/main -name "*.exe" -exec cp {} staging-windows/ArtixAI-${VER}-without-engine.exe \; || true

          (cd artix-ai && ./gradlew :app:packageMsi :app:packageExe "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon) || true
          find artix-ai/app/build/compose/binaries/main -name "*.msi" -exec cp {} staging-windows/ArtixAI-${VER}-with-engine.msi \; || true
          find artix-ai/app/build/compose/binaries/main -name "*.exe" -exec cp {} staging-windows/ArtixAI-${VER}-with-engine.exe \; || true

          # 3. Kritix AI
          (cd kritix-ai && ./gradlew :app:packageMsi :app:packageExe "-Papp.version=${VER}" --no-daemon) || true
          find kritix-ai/app/build/compose/binaries/main -name "*.msi" -exec cp {} staging-windows/KritixAI-${VER}-without-engine.msi \; || true
          find kritix-ai/app/build/compose/binaries/main -name "*.exe" -exec cp {} staging-windows/KritixAI-${VER}-without-engine.exe \; || true

          (cd kritix-ai && ./gradlew :app:packageMsi :app:packageExe "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon) || true
          find kritix-ai/app/build/compose/binaries/main -name "*.msi" -exec cp {} staging-windows/KritixAI-${VER}-with-engine.msi \; || true
          find kritix-ai/app/build/compose/binaries/main -name "*.exe" -exec cp {} staging-windows/KritixAI-${VER}-with-engine.exe \; || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suite-windows
          path: DialexAI/staging-windows/*

  build-linux:
    name: Build Linux Desktop (.deb & .rpm)
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/Kolt
          path: KoltLibs
          token: ${{ secrets.KOLTLIBS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Setup Linux Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Bundled Socratix Engine for Linux
        working-directory: DialexAI
        run: |
          mkdir -p engine-res/engine
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ needs.prepare-release.outputs.version }}" \
            -o engine-res/engine/socratix ./socratix-engine/cmd/socratix
          chmod +x engine-res/engine/socratix

      - name: Package Linux Desktop Packages (DEB & RPM)
        working-directory: DialexAI
        run: |
          mkdir -p staging-linux
          VER="${{ needs.prepare-release.outputs.version }}"
          ENGINE_RES="$(pwd)/engine-res"

          # 1. Dialex AI
          (cd dialex-ai && ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm "-Papp.version=${VER}" --no-daemon)
          find dialex-ai/desktopApp/build/compose/binaries/main/deb -name "*.deb" -exec cp {} staging-linux/DialexAI-${VER}-without-engine.deb \;
          find dialex-ai/desktopApp/build/compose/binaries/main/rpm -name "*.rpm" -exec cp {} staging-linux/DialexAI-${VER}-without-engine.rpm \; || true

          (cd dialex-ai && ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon)
          find dialex-ai/desktopApp/build/compose/binaries/main/deb -name "*.deb" -exec cp {} staging-linux/DialexAI-${VER}-with-engine.deb \;
          find dialex-ai/desktopApp/build/compose/binaries/main/rpm -name "*.rpm" -exec cp {} staging-linux/DialexAI-${VER}-with-engine.rpm \; || true

          # 2. Artix AI
          (cd artix-ai && ./gradlew :app:packageDeb :app:packageRpm "-Papp.version=${VER}" --no-daemon)
          find artix-ai/app/build/compose/binaries/main/deb -name "*.deb" -exec cp {} staging-linux/ArtixAI-${VER}-without-engine.deb \;
          find artix-ai/app/build/compose/binaries/main/rpm -name "*.rpm" -exec cp {} staging-linux/ArtixAI-${VER}-without-engine.rpm \; || true

          (cd artix-ai && ./gradlew :app:packageDeb :app:packageRpm "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon)
          find artix-ai/app/build/compose/binaries/main/deb -name "*.deb" -exec cp {} staging-linux/ArtixAI-${VER}-with-engine.deb \;
          find artix-ai/app/build/compose/binaries/main/rpm -name "*.rpm" -exec cp {} staging-linux/ArtixAI-${VER}-with-engine.rpm \; || true

          # 3. Kritix AI
          (cd kritix-ai && ./gradlew :app:packageDeb :app:packageRpm "-Papp.version=${VER}" --no-daemon)
          find kritix-ai/app/build/compose/binaries/main/deb -name "*.deb" -exec cp {} staging-linux/KritixAI-${VER}-without-engine.deb \;
          find kritix-ai/app/build/compose/binaries/main/rpm -name "*.rpm" -exec cp {} staging-linux/KritixAI-${VER}-without-engine.rpm \; || true

          (cd kritix-ai && ./gradlew :app:packageDeb :app:packageRpm "-Papp.version=${VER}" "-Pengine.resources.dir=${ENGINE_RES}" --no-daemon)
          find kritix-ai/app/build/compose/binaries/main/deb -name "*.deb" -exec cp {} staging-linux/KritixAI-${VER}-with-engine.deb \;
          find kritix-ai/app/build/compose/binaries/main/rpm -name "*.rpm" -exec cp {} staging-linux/KritixAI-${VER}-with-engine.rpm \; || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suite-linux
          path: DialexAI/staging-linux/*

  build-android:
    name: Build Android Mobile (.apk)
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/Kolt
          path: KoltLibs
          token: ${{ secrets.KOLTLIBS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APKs
        working-directory: DialexAI/dialex-ai
        run: ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug "-Papp.version=${{ needs.prepare-release.outputs.version }}" --no-daemon

      - name: Stage Android Artifacts
        run: |
          mkdir -p staging-android
          VER="${{ needs.prepare-release.outputs.version }}"
          if [ -f DialexAI/dialex-ai/androidApp/build/outputs/apk/debug/androidApp-debug.apk ]; then
            cp DialexAI/dialex-ai/androidApp/build/outputs/apk/debug/androidApp-debug.apk staging-android/DialexAI-Mobile-${VER}.apk
          fi
          if [ -f DialexAI/dialex-ai/androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp DialexAI/dialex-ai/androidApp/build/outputs/apk/release/androidApp-release.apk staging-android/DialexAI-Mobile-${VER}-release.apk
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialex-android
          path: staging-android/*

  build-cli-archives:
    name: Build Cross-Platform CLI & Engine Archives
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Cross-Compile Standalone CLI & Engine Archives
        run: |
          chmod +x ./scripts/build-dist.sh
          ./scripts/build-dist.sh --cli --cross-compile --version "${{ needs.prepare-release.outputs.version }}"

      - name: Upload CLI Archives
        uses: actions/upload-artifact@v4
        with:
          name: suite-cli-archives
          path: dist/archives/*

  publish-release:
    name: Publish GitHub Release & Update Manifests
    needs:
      - prepare-release
      - build-macos
      - build-windows
      - build-linux
      - build-android
      - build-cli-archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Consolidate Artifacts & Compute SHA256 Checksums
        run: |
          mkdir -p dist-release
          find release-assets -type f -exec cp {} dist-release/ \;
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Extract Changelog Section
        id: changelog
        run: |
          TAG="${{ needs.prepare-release.outputs.tag_name }}"
          VER="${{ needs.prepare-release.outputs.version }}"
          
          if grep -q "## \[${VER}\]" CHANGELOG.md; then
            awk -v ver="${VER}" '
              $0 ~ "## \\[" ver "\\]" { flag=1; next }
              $0 ~ "## \\[" && flag { exit }
              flag { print }
            ' CHANGELOG.md > release_notes.md
          else
            echo "### 🚀 DialexAI Suite ${TAG} Release" > release_notes.md
            echo "" >> release_notes.md
            echo "Sovereign Multi-Agent Deliberation, Autonomous Engineering & Automated QA Testing Suite." >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" -n 25 >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "### 🔒 Cryptographic SHA-256 Checksums" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cat dist-release/SHA256SUMS.txt >> release_notes.md
          echo "\`\`\`" >> release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: DialexAI Suite ${{ needs.prepare-release.outputs.tag_name }}
          body_path: release_notes.md
          draft: ${{ needs.prepare-release.outputs.is_draft == 'true' }}
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Release Metadata & Manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md gradle.properties packaging/homebrew/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update metadata for ${{ needs.prepare-release.outputs.tag_name }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
