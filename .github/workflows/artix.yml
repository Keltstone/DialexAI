name: Artix AI Verification & Release Pipeline

on:
  push:
    branches: [ main, develop, 'fix/**' ]
    paths:
      - 'artix-ai/**'
      - '.github/workflows/artix.yml'
    tags:
      - 'v*-enterprise'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'artix-ai/**'
      - '.github/workflows/artix.yml'

concurrency:
  group: artix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-verification:
    name: Go Test Suite & Static Analysis (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@3041fe5600347cf03b8494f8f54362a379559924 # v5.2.0
        with:
          go-version-file: 'artix-ai/go.mod'

      - name: Verify Go Modules
        working-directory: artix-ai
        run: |
          go mod download
          go mod verify

      - name: Static Analysis (go vet)
        working-directory: artix-ai
        run: go vet ./...

      - name: Install Bubblewrap (Linux OS Sandbox - Unprivileged)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Run Unit Tests with Race Detector & Coverage
        working-directory: artix-ai
        run: go test -v -race -cover ./...

      - name: Benign Corpus Evaluation (3-Source Check & Regression Gate)
        working-directory: artix-ai
        run: go run ./cmd/artix-corpus/main.go --output /tmp/ci_corpus.csv --baseline docs/pilot/benign_corpus_results.csv

      - name: Verify Tag Immutability Registry
        run: ./scripts/verify-tag-registry.sh

      - name: Verify Test Suite Retention Gate
        run: ./scripts/check-test-retention.sh --module artix-ai

      - name: Build Enterprise CLI & Daemon Binaries
        working-directory: artix-ai
        env:
          POLICY_PUBKEY: ${{ secrets.ARTIX_POLICY_COMPILED_PUBKEY }}
        run: |
          if [ -z "$POLICY_PUBKEY" ]; then
            echo "Notice: ARTIX_POLICY_COMPILED_PUBKEY secret unset in CI; using verification mock key"
            POLICY_PUBKEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          fi
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X artix/pkg/policy.RequireSignedPolicyFlag=true -X artix/pkg/policy.CompiledTrustedPublicKeyHex=${POLICY_PUBKEY}" -o bin/artix ./cli
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X artix/pkg/policy.RequireSignedPolicyFlag=true -X artix/pkg/policy.CompiledTrustedPublicKeyHex=${POLICY_PUBKEY}" -o bin/artixd ./cmd/artixd
          (cd bin && sha256sum artix artixd > SHA256SUMS)
          cat bin/SHA256SUMS
          ./bin/artix version
          ./bin/artix help

      - name: Upload CLI Binaries and Checksums
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: artix-binaries-linux
          path: artix-ai/bin/
          retention-days: 7

  go-verification-macos:
    name: Go Test Suite & Sandbox Verification (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@3041fe5600347cf03b8494f8f54362a379559924 # v5.2.0
        with:
          go-version-file: 'artix-ai/go.mod'

      - name: Run Go Test Suite with Race Detector on macOS
        working-directory: artix-ai
        run: go test -v -race ./...

  vscode-plugin-build:
    name: VS Code Extension Packaging (.vsix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "20"

      - name: Package VS Code Extension
        working-directory: artix-ai/plugins/vscode
        run: |
          npm ci
          npm run build
          npx @vscode/vsce package --no-git-tag-version -o artix-ai.vsix

      - name: Upload VS Code Extension (.vsix)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: artix-vscode-extension
          path: artix-ai/plugins/vscode/artix-ai.vsix
          retention-days: 7

  intellij-plugin-build:
    name: IntelliJ IDEA Plugin Packaging (.zip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java JDK 21
        uses: actions/setup-java@8df103950263300803644b188b1fcc6195c74294 # v4.6.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0db8c66838a3250da321d234182834929f277635 # v4.1.0
        with:
          cache-read-only: false

      - name: Package IntelliJ Plugin
        working-directory: artix-ai/plugins/intellij
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin --no-daemon --stacktrace

      - name: Upload IntelliJ Plugin (.zip)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: artix-intellij-plugin
          path: artix-ai/plugins/intellij/build/distributions/*.zip
          retention-days: 7

  cockpit-kmp-build:
    name: Desktop Cockpit KMP Compilation
    runs-on: macos-latest
    if: "!contains(github.ref, '-enterprise')"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java JDK 21
        uses: actions/setup-java@8df103950263300803644b188b1fcc6195c74294 # v4.6.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0db8c66838a3250da321d234182834929f277635 # v4.1.0
        with:
          cache-read-only: false

      - name: Compile Artix Cockpit Desktop App
        working-directory: artix-ai
        run: ./gradlew :app:compileKotlinJvm --no-daemon --stacktrace

  adversarial-pr-check:
    name: Adversarial Reviewer PR Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [go-verification]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@3041fe5600347cf03b8494f8f54362a379559924 # v5.2.0
        with:
          go-version-file: 'artix-ai/go.mod'

      - name: Build Artix CLI with Enterprise Flags
        working-directory: artix-ai
        env:
          POLICY_PUBKEY: ${{ secrets.ARTIX_POLICY_COMPILED_PUBKEY }}
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X artix/pkg/policy.RequireSignedPolicyFlag=true -X artix/pkg/policy.CompiledTrustedPublicKeyHex=${POLICY_PUBKEY}" -o bin/artix ./cli

      - name: Run Adversarial Reviewer on PR Diff
        working-directory: artix-ai
        run: |
          echo "Running Artix Adversarial Reviewer against base branch ${{ github.base_ref }}..."
          git diff origin/${{ github.base_ref }}...HEAD > pr.diff
          if [ -s pr.diff ]; then
            ./bin/artix review --diff pr.diff || exit 1
          else
            echo "Clean PR diff; review passed."
          fi

  publish-artix-release:
    name: Publish Artix GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-enterprise')
    needs: [go-verification, vscode-plugin-build, intellij-plugin-build]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@3041fe5600347cf03b8494f8f54362a379559924 # v5.2.0
        with:
          go-version-file: 'artix-ai/go.mod'

      - name: Download Build Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: release-assets
          merge-multiple: true

      - name: Build Enterprise Release Binaries with Compiled Policy Public Key
        working-directory: artix-ai
        env:
          POLICY_PUBKEY: ${{ secrets.ARTIX_POLICY_COMPILED_PUBKEY }}
        run: |
          if [ -z "$POLICY_PUBKEY" ]; then
            echo "ERROR: ARTIX_POLICY_COMPILED_PUBKEY secret is required for enterprise release builds but is unset" >&2
            exit 1
          fi
          mkdir -p bin
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X artix/pkg/policy.RequireSignedPolicyFlag=true -X artix/pkg/policy.CompiledTrustedPublicKeyHex=${POLICY_PUBKEY}" -o bin/artix ./cli
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X artix/pkg/policy.RequireSignedPolicyFlag=true -X artix/pkg/policy.CompiledTrustedPublicKeyHex=${POLICY_PUBKEY}" -o bin/artixd ./cmd/artixd
          mkdir -p ../release-assets
          cp bin/artix bin/artixd ../release-assets/

      - name: Generate Unified SHA256SUMS and Sign
        working-directory: release-assets
        run: |
          sha256sum ./artix ./artixd ./*.vsix ./*.zip > SHA256SUMS
          cat SHA256SUMS
          if [ -z "${{ secrets.ARTIX_RELEASE_SSH_SIGNING_KEY }}" ]; then
            echo "ERROR: ARTIX_RELEASE_SSH_SIGNING_KEY secret is required for enterprise release signing but is unset" >&2
            exit 1
          fi
          echo "${{ secrets.ARTIX_RELEASE_SSH_SIGNING_KEY }}" > release_key
          chmod 600 release_key
          ssh-keygen -Y sign -f release_key -n file SHA256SUMS
          rm -f release_key

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e4a36f6d628860b73c73489849206b02a9eb # v2.0.8
        with:
          tag_name: ${{ github.ref_name }}
          name: Artix Enterprise ${{ github.ref_name }}
          body_path: artix-ai/RELEASE_NOTES.md
          files: |
            release-assets/artix
            release-assets/artixd
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sig
            release-assets/*.vsix
            release-assets/*.zip
          draft: false
          prerelease: false
