name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kmp-and-desktop:
    name: Kotlin Multiplatform & Desktop Tests
    runs-on: macos-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: keltstone/Kolt
          path: KoltLibs

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run KMP Common & Desktop Tests
        working-directory: DialexAI/dialex-ai
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          KOTLIN_COMPILER_VM_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: ./gradlew :shared:allTests :desktopApp:compileKotlinJvm --no-daemon --max-workers=2 --stacktrace

  android-build:
    name: Android Mobile Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: keltstone/Kolt
          path: KoltLibs

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android Client
        working-directory: DialexAI/dialex-ai
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          KOTLIN_COMPILER_VM_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: ./gradlew :androidApp:compileDebugKotlin :androidApp:assembleDebug --no-daemon --max-workers=2

  go-engine:
    name: Go Orchestration Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: socratix-engine/go.sum

      - name: Verify Go Modules
        working-directory: socratix-engine
        run: |
          go mod download
          go mod verify

      - name: Run Engine Tests with Race Detector
        working-directory: socratix-engine
        run: go test -v -race -timeout 5m ./pkg/...

  scribex-verification:
    name: Scribex AI Verification (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'scribex-ai/go.mod'
          cache: false

      - name: Verify Go Modules & Vet
        working-directory: scribex-ai
        run: |
          go mod download
          go mod verify
          go vet ./...

      - name: Run Scribex Test Suite with Race Detector
        working-directory: scribex-ai
        run: go test -v -race -timeout 10m ./...

      - name: Verify Reproducible Multi-Platform Build
        working-directory: scribex-ai
        run: |
          ./scripts/repro-check.sh 1.0.1
          ./scripts/build.sh 1.0.1

      - name: Generate CycloneDX SBOM & Smoke Test Linux CLI
        working-directory: scribex-ai
        run: |
          ./scripts/sbom.sh
          ./dist/scribex_linux_amd64 version
          ./dist/scribex_linux_amd64 -h || [ $? -eq 2 ]


