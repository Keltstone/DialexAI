name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kmp-and-desktop:
    name: Kotlin Multiplatform & Desktop Tests
    runs-on: macos-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/Kolt
          path: KoltLibs

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run KMP Common & Desktop Tests
        working-directory: DialexAI/dialex-ai
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          KOTLIN_COMPILER_VM_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: ./gradlew :shared:allTests :desktopApp:compileKotlinJvm --no-daemon --max-workers=2 --stacktrace

  android-build:
    name: Android Mobile Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4
        with:
          path: DialexAI

      - name: Checkout Kolt Dependency
        uses: actions/checkout@v4
        with:
          repository: Kolta-Labs/Kolt
          path: KoltLibs

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Android Client
        working-directory: DialexAI/dialex-ai
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
          KOTLIN_COMPILER_VM_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=512m"
        run: ./gradlew :androidApp:compileDebugKotlin :androidApp:assembleDebug --no-daemon --max-workers=2

  go-engine:
    name: Go Orchestration Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DialexAI
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: socratix-engine/go.sum

      - name: Verify Go Modules
        working-directory: socratix-engine
        run: |
          go mod download
          go mod verify

      - name: Run Engine Tests with Race Detector
        working-directory: socratix-engine
        run: go test -v -race -timeout 5m ./pkg/...

