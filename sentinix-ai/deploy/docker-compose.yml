# SENTINIX_PGSSLMODE: set to require/verify-full when the db is not on the private compose network.
# docker compose -f deploy/docker-compose.yml --env-file .env up
# .env (not committed) defines POSTGRES_PASSWORD, SENTINIX_SESSION_KEY (32+ chars), the git host tokens/secrets
# referenced by sentinix.json, and the OIDC_* variables.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentinix
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinix"]
      interval: 5s
      retries: 10
  sentinix:
    build: { context: .., dockerfile: deploy/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    command: ["-db", "postgres://sentinix:${POSTGRES_PASSWORD}@db:5432/sentinix?sslmode=${SENTINIX_PGSSLMODE:-prefer}", "-config", "/etc/sentinix/sentinix.json"]
    env_file: ../.env
    ports: ["8080:8080"]
    volumes: ["./sentinix.json:/etc/sentinix/sentinix.json:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
volumes:
  pgdata: {}
