name: Scribex check
description: Fail the PR when anchored docs are stale or dead. Impact gate skips when no public contract changed.
inputs:
  base:
    description: Git ref to diff against
    default: origin/main
  github-token:
    description: GitHub token for PR comment
    default: ''
  comment:
    description: Post PR comment if token provided
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version: '1.27.0'
    - shell: bash
      env:
        GOTOOLCHAIN: local
        CGO_ENABLED: '0'
        GOFLAGS: -mod=readonly
        BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        if [[ ! "$BASE" =~ ^[A-Za-z0-9._/@~^-]{1,200}$ ]] || [[ "$BASE" =~ ^- ]]; then
          echo "scribex: invalid base ref $BASE" >&2
          exit 2
        fi
        (
          cd "${{ github.action_path }}/.."
          mkdir -p "$RUNNER_TEMP/scribex-bin"
          go build -trimpath -buildvcs=false -ldflags "-s -w -X main.version=${VERSION:-1.0.0}" -o "$RUNNER_TEMP/scribex-bin/scribex" ./cmd/scribex
        )
        echo "$RUNNER_TEMP/scribex-bin" >> "$GITHUB_PATH"
        sha256sum "$RUNNER_TEMP/scribex-bin/scribex"
        scribex check -base "$BASE"
    - if: github.event_name == 'pull_request' && inputs.comment == 'true' && inputs.github-token != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BASE: ${{ inputs.base }}
        PR_NUMBER: ${{ github.event.number }}
      run: |
        set -euo pipefail
        if [[ ! "$BASE" =~ ^[A-Za-z0-9._/@~^-]{1,200}$ ]] || [[ "$BASE" =~ ^- ]]; then
          echo "scribex: invalid base ref $BASE" >&2
          exit 2
        fi
        scribex comment -repo "$GITHUB_REPOSITORY" -pr "$PR_NUMBER" -base "$BASE"
