name: Artix CI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Build, Vet, Test and Enterprise Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Go Build All
        run: go build ./...

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -race -count=1 ./...

      - name: Enterprise Binary Builds
        run: |
          mkdir -p bin
          TRUSTED_PUBKEY="${{ secrets.ARTIX_POLICY_COMPILED_PUBKEY }}"
          if [ -z "$TRUSTED_PUBKEY" ]; then
            echo "ERROR: ARTIX_POLICY_COMPILED_PUBKEY secret is required for enterprise build but is unset" >&2
            exit 1
          fi
          go build -ldflags "-X artix/pkg/policy.RequireSignedPolicyFlag=true -X artix/pkg/policy.CompiledTrustedPublicKeyHex=${TRUSTED_PUBKEY} -s -w" -o bin/artix ./cli
          go build -ldflags "-X artix/pkg/policy.RequireSignedPolicyFlag=true -X artix/pkg/policy.CompiledTrustedPublicKeyHex=${TRUSTED_PUBKEY} -s -w" -o bin/artixd ./cmd/artixd

      - name: Compute Checksums
        run: |
          cd bin
          sha256sum artix artixd > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Binaries and Checksums
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-binaries
          path: |
            bin/artix
            bin/artixd
            bin/SHA256SUMS

  plugins:
    name: Build IDE Plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for VS Code Plugin
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build VS Code Plugin (.vsix)
        working-directory: plugins/vscode
        run: |
          npm ci || npm install
          npm run build
          npx @vscode/vsce package --no-git-tag-version --allow-missing-repository

      - name: Set up JDK for IntelliJ Plugin
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build IntelliJ Plugin (.zip)
        working-directory: plugins/intellij
        run: |
          chmod +x ./gradlew || true
          ./gradlew buildPlugin --no-daemon

      - name: Upload Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ide-plugins
          path: |
            plugins/vscode/*.vsix
            plugins/intellij/build/distributions/*.zip

