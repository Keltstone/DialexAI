# ==============================================================================
# Dialex Engine Docker Compose (Scenario C: Tailscale Mesh Sidecar)
# ==============================================================================
# This setup joins Dialex directly to your private Tailscale network.
# - Zero open router ports
# - End-to-end WireGuard encrypted
# - Accessible via MagicDNS: http://dialex-engine.your-tailnet.ts.net:7890
#
# Prerequisite:
#   1. Generate an auth key at https://login.tailscale.com/admin/settings/keys
#   2. Add TS_AUTHKEY=tskey-auth-... to your .env file
#   3. Run: docker compose -f docker-compose.tailscale.yml up -d
# ==============================================================================

version: '3.8'

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: dialex-tailscale
    hostname: dialex-engine
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  dialex:
    image: ghcr.io/keltstone/dialex:latest
    build:
      context: ..
      dockerfile: selfhosting/Dockerfile
    container_name: dialex-engine
    restart: unless-stopped
    # Share network stack with Tailscale container
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./data:/root/.config/dialex
    environment:
      - DIALEX_HOST=0.0.0.0:7890
      - DIALEX_PORT=7890
      - DIALEX_ALLOW_INSECURE_LAN=true
      - DIALEX_CONFIG_DIR=/root/.config/dialex
    env_file:
      - path: .env
        required: false
